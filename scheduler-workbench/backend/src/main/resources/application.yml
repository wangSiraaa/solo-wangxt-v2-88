spring:
  application:
    name: scheduler-workbench
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/workbench
    username: ${DB_USER:workbench}
    password: ${DB_PASSWORD:workbench}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  quartz:
    job-store-type: memory
server:
  port: 8080

demo:
  clock-enabled: true

---
spring:
  config:
    activate:
      on-profile: demo
  datasource:
    url: jdbc:h2:mem:workbench;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true
