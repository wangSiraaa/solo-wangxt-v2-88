services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cycleworkbench
      POSTGRES_USER: cycle
      POSTGRES_PASSWORD: cycle
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cycle -d cycleworkbench"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
